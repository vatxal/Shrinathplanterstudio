<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shrinath Planter Studio</title>

<style>

/* Smooth fade animation for category change */
.fade-in {
    animation: fadeIn 0.35s ease-in-out;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
    color: #2e2e2e;
}

h1 {
    text-align: center;
    padding: 20px 10px 8px;
    font-size: 34px;
    color: #1b5e20;
}

/* Cart Button */

.cart-btn {
    position: fixed;
    top: 10px;
    right: 10px;
    background: none;
    color: white;
    border: #1b5e20;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    font-size: 24px;
    cursor: pointer;
    z-index: 999;
    box-shadow: 0 8px 18px rgba(0,0,0,0.25);
}

.cart-count {
    position: absolute;
    top: -5px;
    right: -5px;
    background: red;
    color: white;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Move To Top Button */

.top-btn {
    position: fixed;
    bottom: 25px;
    right: 22px;
    background: #1b5e20;
    color: white;
    border: none;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    font-size: 26px;
    cursor: pointer;
    display: none;
    z-index: 999;
    box-shadow: 0 8px 18px rgba(0,0,0,0.25);
}

.filter-bar {
    text-align: center;
    margin-bottom: 20px;
}

.filter-btn {
    padding: 10px 18px;
    margin: 5px;
    border: none;
    border-radius: 25px;
    font-size: 15px;
    cursor: pointer;
    background: #e0e0e0;
    transition: 0.3s;
}

.filter-btn.active,
.filter-btn:hover {
    background: #1b5e20;
    color: white;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
    padding: 30px;
    max-width: 1400px;
    margin: auto;
}

.card {
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    overflow: hidden;
    transition: transform 0.3s ease;
    cursor: pointer;
    position: relative;
}

.card:hover {
    transform: translateY(-6px);
}

.card.selected {
    border: 4px solid #1b5e20;
}

.card img {
    width: 100%;
    height: 480px;
    object-fit: contain;
    object-position: center;
    background: white;
    display: block;
    padding: 4px;
    box-sizing: border-box;
}

.info {
    padding: 15px;
    text-align: center;
}

.name {
    font-size: 20px;
    font-weight: 600;
    color: #1b5e20;
}

.dimension {
    font-size: 14px;
    color: #555;
    margin-top: 4px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #666;
    font-size: 14px;
}



/* Shrinath Planter Studio brand refresh — presentation only */
:root {
    --forest: #18391f;
    --forest-deep: #102b17;
    --leaf: #4e6f32;
    --gold: #98701d;
    --gold-light: #d9c38d;
    --cream: #f7f2e8;
    --paper: #fffdf8;
    --muted: #6e6a5e;
}

html { scroll-behavior: smooth; }
body {
    background: #f7f2e8;
    color: var(--forest-deep);
    font-family: 'Segoe UI', Arial, sans-serif;
}
.brand-banner {
    width: min(100%, 1240px);
    margin: 0 auto;
    padding: 18px 24px 8px;
    text-align: center;
}
.brand-wordmark {
    width: 100%;
    margin: 0 auto;
    text-align: center;
    line-height: 1;
    font-family: Georgia, "Times New Roman", serif;
}
.brand-name {
    color: #18391f;
    font-size: clamp(44px, 8vw, 100px);
    font-weight: 900;
    letter-spacing: -0.035em;
    text-shadow: 0 1px 0 rgba(16, 43, 23, 0.12);
}
.brand-subtitle {
    margin-top: 2px;
    color: #98701d;
    font-size: clamp(28px, 5vw, 62px);
    font-weight: 900;
    letter-spacing: -0.02em;
    text-shadow: 0 1px 0 rgba(152, 112, 29, 0.12);
}
.filter-bar {
    display: flex;
    align-items: stretch;
    justify-content: center;
    flex-wrap: wrap;
    gap: 11px;
    max-width: 1200px;
    margin: 18px auto 12px;
    padding: 0 24px 14px;
}
.filter-btn {
    position: relative;
    isolation: isolate;
    padding: 14px 22px;
    margin: 0;
    min-height: 52px;
    border: 1px solid #d9ceb2;
    border-radius: 14px;
    background: linear-gradient(145deg, #fffdf8, #f1ead9);
    color: #29432a;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .015em;
    box-shadow: 0 4px 12px rgba(55, 47, 27, .07), inset 0 1px 0 rgba(255,255,255,.9);
    transition: transform .22s ease, box-shadow .22s ease, background .22s ease, border-color .22s ease;
}
.filter-btn::before {
    content: "✦";
    color: var(--gold);
    margin-right: 8px;
    font-size: 12px;
}
.filter-btn:hover {
    transform: translateY(-3px);
    border-color: #b49a5e;
    background: linear-gradient(145deg, #fffefb, #e9dfc6);
    color: var(--forest-deep);
    box-shadow: 0 8px 18px rgba(55, 47, 27, .12);
}
.filter-btn.active {
    color: #fffaf0;
    border-color: var(--forest);
    background: linear-gradient(135deg, #264b2a, #102b17);
    box-shadow: 0 7px 17px rgba(24, 57, 31, .23);
}
.filter-btn.active::before { color: #e1c77f; }
.gallery {
    gap: 25px;
    padding: 24px 30px 36px;
}
.card {
    border: 1px solid rgba(152, 112, 29, .18);
    border-radius: 18px;
    background: var(--paper);
    box-shadow: 0 9px 26px rgba(37, 48, 30, .09);
    transition: transform .28s ease, box-shadow .28s ease, border-color .28s ease;
}
.card:hover {
    transform: translateY(-6px);
    border-color: rgba(152, 112, 29, .48);
    box-shadow: 0 16px 34px rgba(37, 48, 30, .15);
}
.card.selected {
    border: 3px solid var(--forest);
    box-shadow: 0 0 0 3px rgba(217,195,141,.55), 0 12px 28px rgba(24,57,31,.14);
}
.card img {
    background: #ffffff;
    padding: 12px;
}
.info {
    padding: 17px 15px 20px;
    background: linear-gradient(180deg, #fffdf8, #f8f2e5);
    border-top: 1px solid #eee4ce;
}
.name {
    color: var(--forest);
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 22px;
    font-weight: 700;
}
.dimension {
    display: inline-block;
    margin-top: 8px;
    padding: 5px 10px;
    border: 1px solid #e5d7b7;
    border-radius: 999px;
    background: #f4ecd9;
    color: #71664d;
    font-size: 14px;
    letter-spacing: .025em;
}
.cart-btn {
    background: linear-gradient(145deg, #294f2d, #102b17);
    color: #fffaf0;
    border: 1px solid rgba(226, 202, 139, .8);
}
.cart-count {
    background: #a67a24;
    border: 2px solid #fffaf0;
}
.top-btn {
    background: linear-gradient(145deg, #294f2d, #102b17);
    border: 1px solid rgba(226, 202, 139, .8);
}
/* First-visit shopping guidance */
.selection-tip {
    display: flex;
    align-items: center;
    gap: 12px;
    width: min(100% - 32px, 980px);
    margin: 8px auto 14px;
    padding: 13px 16px;
    border: 1px solid #d9c38d;
    border-radius: 14px;
    background: #fffdf8;
    color: #29432a;
    box-shadow: 0 5px 16px rgba(55, 47, 27, .06);
    font-size: 14px;
    line-height: 1.55;
}
.tip-icon {
    flex: 0 0 28px;
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #18391f;
    color: #fffdf8;
    font-weight: 800;
}
.tip-close {
    margin-left: auto;
    flex: 0 0 auto;
    border: 0;
    background: transparent;
    color: #6e6a5e;
    font-size: 24px;
    line-height: 1;
    padding: 2px 4px;
}
.tip-close:hover { color: #18391f; }

footer {
    margin-top: 8px;
    padding: 28px 20px 34px;
    color: #5e644e;
    border-top: 1px solid #e2d5b8;
    background: rgba(255,253,248,.65);
    letter-spacing: .04em;
}
@media (max-width: 640px) {
    .brand-banner { padding: 8px 10px 4px; }
    .brand-name { font-size: clamp(40px, 11vw, 64px); }
    .brand-subtitle { font-size: clamp(27px, 7.2vw, 42px); }
    .selection-tip { width: calc(100% - 24px); gap: 9px; padding: 11px 12px; font-size: 12px; align-items: flex-start; }
    .tip-icon { flex-basis: 25px; width: 25px; height: 25px; }
    .filter-bar { gap: 8px; padding: 0 12px 10px; margin-top: 12px; }
    .filter-btn { flex: 1 1 calc(50% - 8px); padding: 12px 9px; min-height: 48px; font-size: 12px; border-radius: 12px; }
    .filter-btn:last-child { flex-grow: 0; }
    .gallery { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; padding: 16px 14px 28px; }
    .card img { height: 360px; }
    .name { font-size: 20px; }
    .cart-btn { width: 52px; height: 52px; top: 12px; right: 12px; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}

.catalog-link {
    display: block;
    text-align: center;
    margin: 12px 10px;
    font-size: 14px;
    line-height: 1.5;
}

.catalog-browse-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 14px;
    padding: 12px 20px;
    min-height: 44px;
    border: 0;
    border-radius: 999px;
    background: #18391f;
    color: #fffdf8;
    font: 600 14px 'Segoe UI', Arial, sans-serif;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(16,43,23,.16);
    transition: background .2s ease, transform .2s ease;
}
.catalog-browse-btn:hover { background: #98701d; transform: translateY(-1px); }
.catalog-browse-btn:focus-visible { outline: 3px solid #d9c38d; outline-offset: 3px; }

.catalog-link a {
    color: #1b5e20;
    font-weight: 600;
    text-decoration: underline;
}

.catalog-link a:hover {
    color: #98701d;
}


/* Enquiry cart popup */
.cart-modal { display:none; position:fixed; inset:0; z-index:2200; align-items:center; justify-content:center; padding:18px; }
.cart-modal.open { display:flex; }
.cart-modal-backdrop { position:absolute; inset:0; background:rgba(12,25,14,.62); backdrop-filter:blur(3px); }
.cart-dialog { position:relative; width:min(100%,620px); max-height:min(85vh,760px); overflow:auto; border:1px solid #d9c38d; border-radius:20px; background:#fffdf8; box-shadow:0 24px 70px rgba(0,0,0,.28); padding:22px; color:#102b17; }
.cart-dialog-header { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; padding-bottom:16px; border-bottom:1px solid #e8dec8; }
.cart-dialog-header h2 { margin:0; color:#18391f; font:700 27px Georgia,serif; }
.cart-dialog-header p { margin:6px 0 0; color:#6e6a5e; font-size:13px; line-height:1.5; }
.cart-close { border:0; background:transparent; color:#53604e; font-size:30px; line-height:1; cursor:pointer; }
.cart-items { display:grid; gap:12px; padding:16px 0; }
.cart-empty { padding:28px 10px; text-align:center; color:#6e6a5e; }
.cart-item { display:grid; grid-template-columns:1fr auto; gap:10px 14px; align-items:center; padding:13px; border:1px solid #e7dcc4; border-radius:13px; background:#fff; }
.cart-item-name { font-weight:700; color:#18391f; }
.cart-item-size { margin-top:5px; color:#71664d; font-size:12px; line-height:1.4; }
.cart-item-controls { display:flex; align-items:center; gap:7px; }
.cart-qty-input {
    width: 65px;
    height: 34px;
    text-align: center;
    border: 1px solid #d9ceb2;
    border-radius: 8px;
    background: #fffdf8;
    color: #18391f;
    font-size: 15px;
    font-weight: 600;
    box-sizing: border-box;
}
.cart-item-controls button { width:30px; height:30px; border:1px solid #d9ceb2; border-radius:8px; background:#f7f2e8; color:#18391f; font-size:18px; cursor:pointer; }
.cart-qty { min-width:20px; text-align:center; font-weight:700; }
.cart-remove { grid-column:1/-1; justify-self:end; border:0; background:transparent; color:#a13d32; font-size:12px; font-weight:700; cursor:pointer; }
.cart-size-select { max-width:100%; margin-top:7px; padding:7px 9px; border:1px solid #d9ceb2; border-radius:8px; background:#fffdf8; color:#29432a; font-size:12px; }
.cart-dialog-footer { display:flex; gap:10px; padding-top:15px; border-top:1px solid #e8dec8; }
.cart-dialog-footer button { flex:1; min-height:44px; padding:10px 13px; border-radius:10px; font-weight:700; cursor:pointer; }
.continue-btn { border:1px solid #d9ceb2; background:#f7f2e8; color:#29432a; }
.whatsapp-btn { border:1px solid #1d7137; background:#237a3d; color:white; }
.card-size-nav { display:flex; align-items:center; justify-content:center; gap:12px; margin-top:9px; }
.card-size-nav button { width:27px; height:27px; border:1px solid #d9ceb2; border-radius:50%; background:#f7f2e8; color:#18391f; cursor:pointer; }
.card-size-position { color:#71664d; font-size:11px; }
.card.swipe-ready { touch-action:pan-y; }
@media (max-width:520px) { .cart-dialog { padding:17px; } .cart-dialog-header h2 { font-size:23px; } .cart-dialog-footer { flex-direction:column-reverse; } .cart-item { grid-template-columns:1fr; } .cart-item-controls { justify-content:flex-start; } }


/* Nest & Vine page-selection catalogue */
.catalog-modal { display:none; position:fixed; inset:0; z-index:2100; align-items:center; justify-content:center; padding:12px; }
.catalog-modal.open { display:flex; }
.catalog-backdrop { position:absolute; inset:0; background:rgba(12,25,14,.72); backdrop-filter:blur(4px); }
.catalog-dialog { position:relative; width:min(1180px,100%); height:min(94vh,980px); display:flex; flex-direction:column; overflow:hidden; border:1px solid #d9c38d; border-radius:18px; background:#fffdf8; box-shadow:0 24px 70px rgba(0,0,0,.32); color:#102b17; }
.catalog-header { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:15px 18px; border-bottom:1px solid #e8dec8; }
.catalog-header h2 { margin:0; color:#18391f; font:700 24px Georgia,serif; }
.catalog-header p { margin:5px 0 0; color:#6e6a5e; font-size:13px; line-height:1.45; }
.catalog-header-actions { display:flex; align-items:center; gap:10px; flex-shrink:0; }
.catalog-cart-btn { display:inline-flex; align-items:center; gap:7px; min-height:39px; padding:8px 13px; border:1px solid #cbb77f; border-radius:999px; background:linear-gradient(145deg,#fffdf8,#f0e8d6); color:#18391f; font-size:13px; font-weight:700; cursor:pointer; box-shadow:0 3px 9px rgba(55,47,27,.08); transition:transform .2s ease,box-shadow .2s ease; }
.catalog-cart-btn:hover { transform:translateY(-1px); box-shadow:0 6px 13px rgba(55,47,27,.14); }
.catalog-cart-count { display:inline-grid; place-items:center; min-width:21px; height:21px; padding:0 5px; border-radius:50px; background:#294f2d; color:#fff; font-size:11px; line-height:1; }
.catalog-close { border:0; background:transparent; color:#53604e; font-size:30px; line-height:1; cursor:pointer; }
.catalog-toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:9px; padding:11px 16px; background:#f7f2e8; border-bottom:1px solid #e8dec8; }
.catalog-toolbar label { font-size:13px; font-weight:700; color:#29432a; }
.catalog-toolbar select { min-width:190px; max-width:100%; padding:9px 11px; border:1px solid #d9ceb2; border-radius:9px; background:#fffdf8; color:#18391f; }
.catalog-nav-btn,.catalog-add-btn,.catalog-open-link { min-height:38px; padding:8px 12px; border:1px solid #d9ceb2; border-radius:9px; background:#fffdf8; color:#29432a; font-weight:700; cursor:pointer; text-decoration:none; font-size:13px; }
.catalog-nav-btn:disabled { opacity:.4; cursor:not-allowed; }
.catalog-details { display:flex; flex-wrap:wrap; align-items:center; gap:8px 18px; padding:10px 17px; border-bottom:1px solid #e8dec8; }
.catalog-details strong { color:#18391f; font-family:Georgia,serif; font-size:18px; }
.catalog-dimensions { display:flex; flex-wrap:wrap; gap:6px; }
.catalog-dimension-chip { padding:5px 9px; border:1px solid #e5d7b7; border-radius:999px; background:#f4ecd9; color:#71664d; font-size:12px; }
.catalog-viewer { flex:1 1 auto; min-height:160px; overflow:auto; background:#e8e3d7; display:flex; justify-content:center; align-items:flex-start; padding:12px; }
#nestVinePdfCanvas { display:block; width:100%; max-width:900px; height:auto; background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.18); }
#nestVinePdfStatus { padding:22px; color:#29432a; text-align:center; font-size:14px; }
.catalog-footer { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 16px; border-top:1px solid #e8dec8; background:#fffdf8; }
.catalog-footer-note { color:#71664d; font-size:12px; line-height:1.4; }
.catalog-add-btn { border-color:#1d7137; background:#237a3d; color:#fff; padding:11px 18px; }
.catalog-open-link { white-space:nowrap; }
@media(max-width:640px) {
 .catalog-modal { padding:0; }
 .catalog-dialog { width:100%; height:100dvh; max-height:100dvh; border-radius:0; }
 .catalog-header { padding:12px 14px; }
 .catalog-header-actions { gap:6px; }
 .catalog-cart-btn { min-height:36px; padding:7px 9px; font-size:12px; }
 .catalog-header h2 { font-size:21px; }
 .catalog-toolbar { gap:7px; padding:9px 11px; }
 .catalog-toolbar label { width:100%; }
 .catalog-toolbar select { flex:1 1 100%; width:100%; }
 .catalog-nav-btn,.catalog-open-link { flex:1; text-align:center; }
 .catalog-details { padding:9px 12px; }
 .catalog-details strong { font-size:16px; }
 .catalog-viewer { padding:6px; }
 .catalog-footer { align-items:stretch; flex-direction:column; padding:10px 12px; }
 .catalog-add-btn { width:100%; }
}


/* Catalogue polish: aligned with the Studio forest-green / cream / antique-gold theme */
.catalog-modal { visibility:hidden; opacity:0; transition:opacity .28s ease, visibility .28s ease; }
.catalog-modal.open { visibility:visible; opacity:1; }
.catalog-modal.open .catalog-backdrop { animation:catalogBackdropIn .28s ease both; }
.catalog-modal.open .catalog-dialog { animation:catalogDialogIn .36s cubic-bezier(.2,.75,.25,1) both; }
@keyframes catalogBackdropIn { from{opacity:0} to{opacity:1} }
@keyframes catalogDialogIn { from{opacity:0;transform:translateY(16px) scale(.99)} to{opacity:1;transform:translateY(0) scale(1)} }
.catalog-dialog { border-radius:22px; border-color:rgba(152,112,29,.5); box-shadow:0 28px 85px rgba(16,43,23,.34); }
.catalog-header { align-items:center; padding:17px 22px; background:linear-gradient(110deg,#fffdf8,#f4ecd9); border-bottom:1px solid #e5d7b7; }
.catalog-header h2 { font-size:clamp(21px,2.5vw,27px); letter-spacing:-.02em; }
.catalog-header p,.catalog-details { display:none !important; }
.catalog-toolbar { gap:10px; padding:13px 17px; background:#f7f2e8; }
.catalog-toolbar select { min-height:42px; border:1px solid #d9cba9; border-radius:11px; }
.catalog-nav-btn,.catalog-open-link { display:inline-flex; align-items:center; justify-content:center; min-height:42px; padding:9px 17px; border-radius:999px; font-weight:700; transition:transform .2s ease,box-shadow .2s ease,background .2s ease; }
.catalog-nav-btn { border:1px solid #cfc19e; color:#29432a; background:linear-gradient(145deg,#fffdf8,#f0e8d6); box-shadow:0 3px 9px rgba(55,47,27,.07); }
.catalog-nav-btn:not(:disabled):hover { transform:translateY(-2px); border-color:#98701d; box-shadow:0 7px 15px rgba(55,47,27,.13); }
.catalog-open-link { border:1px solid #18391f; color:#fffaf0; background:linear-gradient(135deg,#294f2d,#102b17); box-shadow:0 4px 11px rgba(16,43,23,.18); }
.catalog-open-link:hover { transform:translateY(-2px); color:#fffaf0; background:linear-gradient(135deg,#98701d,#765514); }
.catalog-footer { justify-content:flex-end; gap:12px; background:linear-gradient(110deg,#fffdf8,#f7f2e8); border-top:1px solid #e5d7b7; }
.catalog-rp-label { color:#29432a; font-size:13px; font-weight:700; }
.catalog-rp-select { min-width:190px; min-height:42px; padding:9px 12px; border:1px solid #d9cba9; border-radius:11px; background:#fffdf8; color:#18391f; font-weight:600; }
.catalog-add-btn { border-radius:999px; background:linear-gradient(135deg,#294f2d,#102b17); border:1px solid #18391f; box-shadow:0 5px 13px rgba(16,43,23,.18); }

async function ensureNestVinePdfLoaded() {
    if (nestVinePdfDocument) return nestVinePdfDocument;
    if (nestVinePdfLoading) return nestVinePdfLoading;

    const status = document.getElementById('nestVinePdfStatus');
    status.textContent = 'Loading catalogue preview…';
    if (!window.pdfjsLib) {
        throw new Error('The PDF preview library could not be loaded. Check your internet connection or the PDF.js CDN.');
    }

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    // Resolve from the page URL so the PDF still loads when the site is hosted
    // inside a GitHub Pages project path (rather than the domain root).
    const pdfUrl = new URL('assets/nest-vine-catalog-2026.pdf', document.baseURI).href;
    const loadingTask = pdfjsLib.getDocument({ url: pdfUrl });
    loadingTask.onProgress = ({ loaded, total }) => {
        if (total > 0) {
            const percent = Math.min(99, Math.round((loaded / total) * 100));
            status.textContent = `Loading catalogue preview… ${percent}%`;
        } else if (loaded > 0) {
            status.textContent = 'Downloading catalogue preview…';
        }
    };

    const loadPromise = (async () => {
        let timeoutId;
        try {
            const timeoutPromise = new Promise((_, reject) => {
                timeoutId = setTimeout(() => reject(new Error(
                    'The catalogue PDF did not respond. Check that assets/nest-vine-catalog-2026.pdf exists and that its filename matches exactly.'
                )), 30000);
            });
            const pdf = await Promise.race([loadingTask.promise, timeoutPromise]);
            nestVinePdfDocument = pdf;
            return pdf;
        } catch (error) {
            try { await loadingTask.destroy(); } catch (_) {}
            throw error;
        } finally {
            clearTimeout(timeoutId);
            nestVinePdfLoading = null;
        }
    })();
    nestVinePdfLoading = loadPromise;
    return loadPromise;
}

async function renderNestVinePdfPage(pageNumber) {
    const requestId = ++nestVineRenderRequest;
    const status = document.getElementById('nestVinePdfStatus');
    const canvas = document.getElementById('nestVinePdfCanvas');
    status.style.display = 'block';
    canvas.style.display = 'none';
    status.textContent = `Loading catalogue page ${pageNumber}…`;
    try {
        const pdf = await ensureNestVinePdfLoaded();
        if (requestId !== nestVineRenderRequest) return;
        if (nestVinePdfRenderTask) {
            try { nestVinePdfRenderTask.cancel(); } catch (_) {}
            nestVinePdfRenderTask = null;
        }
        const page = await pdf.getPage(pageNumber);
        if (requestId !== nestVineRenderRequest) return;
        const viewer = document.querySelector('.catalog-viewer');
        const baseViewport = page.getViewport({ scale: 1 });
        const availableWidth = Math.max(260, viewer.clientWidth - 30);
        const isDesktop = window.innerWidth > 640;

        // On desktop, fit the complete PDF page inside the visible viewer area.
        // On mobile, retain the existing width-first behaviour for readability.
        const widthScale = availableWidth / baseViewport.width;
        const availableHeight = Math.max(200, viewer.clientHeight - 24);
        const heightScale = availableHeight / baseViewport.height;
        const scale = isDesktop
            ? Math.min(1.5, widthScale, heightScale)
            : Math.min(2, widthScale);
        const viewport = page.getViewport({ scale });
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(viewport.width * pixelRatio);
        canvas.height = Math.floor(viewport.height * pixelRatio);
        canvas.style.width = `${Math.floor(viewport.width)}px`;
        canvas.style.height = `${Math.floor(viewport.height)}px`;
        const context = canvas.getContext('2d');
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        nestVinePdfRenderTask = page.render({ canvasContext: context, viewport });
        await nestVinePdfRenderTask.promise;
        nestVinePdfRenderTask = null;
        status.style.display = 'none';
        canvas.style.display = 'block';
        viewer.scrollTop = 0;
    } catch (error) {
        if (error && error.name === 'RenderingCancelledException') return;
        console.error('Nest & Vine PDF preview error:', error);
        canvas.style.display = 'none';
        status.style.display = 'block';
        status.textContent = 'Preview could not be loaded. Please use “Open PDF” to view the catalogue.';
    }
}

let nestVinePdfResizeTimer = null;
window.addEventListener('resize', () => {
    clearTimeout(nestVinePdfResizeTimer);
    nestVinePdfResizeTimer = setTimeout(() => {
        const modal = document.getElementById('nestVineCatalogModal');
        if (modal && modal.classList.contains('open') && nestVinePdfDocument) {
            renderNestVinePdfPage(activeNestVinePage);
        }
    }, 160);
});

function openNestVineCatalog() {
    const modal = document.getElementById('nestVineCatalogModal');
    const select = document.getElementById('catalogPageSelect');
    if (!select.options.length) {
        select.innerHTML = nestVineProductPages.map(page => {
            const product = nestVineCatalogProducts[page];
            return `<option value="${page}">Page ${page} — ${escapeHtml(product.name)}</option>`;
        }).join('');
    }
    modal.classList.add('open');
    modal.setAttribute('aria-hidden','false');
    selectNestVinePage(activeNestVinePage);
    document.body.style.overflow='hidden';
}

function closeNestVineCatalog() {
    const modal = document.getElementById('nestVineCatalogModal');
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden','true');
    document.body.style.overflow='';
}

function selectNestVinePage(value) {
    const page = Number(value);
    if (!nestVineCatalogProducts[page]) return;
    activeNestVinePage = page;
    activeNestVineRpIndex = 0;
    document.getElementById('catalogPageSelect').value = String(page);
    const rpSelect = document.getElementById('catalogRpSelect');
    const product = nestVineCatalogProducts[page];
    rpSelect.innerHTML = product.dimensions.map((item, index) => {
        const code = item.split(' — ')[0];
        return `<option value="${index}">${escapeHtml(code)}</option>`;
    }).join('');
    rpSelect.value = '0';
    rpSelect.onchange = () => { activeNestVineRpIndex = Number(rpSelect.value); };
    renderNestVinePdfPage(page);
    document.getElementById('catalogOpenPdf').href = `${new URL('assets/nest-vine-catalog-2026.pdf', document.baseURI).href}#page=${page}`;
    const index = nestVineProductPages.indexOf(page);
    document.getElementById('catalogPrevBtn').disabled = index <= 0;
    document.getElementById('catalogNextBtn').disabled = index >= nestVineProductPages.length - 1;
}

function stepNestVinePage(direction) {
    const index = nestVineProductPages.indexOf(activeNestVinePage);
    const next = nestVineProductPages[index + direction];
    if (next) selectNestVinePage(next);
}

function addNestVinePageToCart() {
    const product = nestVineCatalogProducts[activeNestVinePage];
    if (!product) return;
    const selected = product.dimensions[activeNestVineRpIndex];
    if (!selected) return;
    const rpCode = selected.split(' — ')[0];
    const id = `nestvine-${activeNestVinePage}-${rpCode.toLowerCase()}`;
    const existing = cart.find(item => item.id === id);
    if (existing) {
        existing.quantity += 1;
    } else {
        cart.push({
            id,
            name: `Nest & Vine — ${product.name} — ${rpCode}`,
            dimension: selected,
            options: [selected],
            quantity: 1,
            catalogPage: activeNestVinePage,
            rpCode
        });
    }
    renderCartCount();
    closeNestVineCatalog();
    openCartModal(true);
}


function loadCategory(category, btn) {
    const gallery = document.getElementById("gallery");
    activeCategory = category;
    gallery.innerHTML = "";
    gallery.classList.remove("fade-in");
    void gallery.offsetWidth;
    gallery.classList.add("fade-in");
    gallery.innerHTML = data[category] || "";
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    prepareProductCards(category);
    restoreSelections();
}

function prepareProductCards(category) {
    const cards = document.querySelectorAll('#gallery .card');
    cards.forEach((card, index) => {
        const name = card.querySelector('.name')?.innerText.trim() || 'Planter';
        const dimension = card.querySelector('.dimension')?.innerText.trim() || '';
        const isCatalogTrigger = card.dataset.catalogTrigger === 'true';
        const canSelect = (category === 'intro' || category === 'Harshdeep') && !isCatalogTrigger;
        card.dataset.productId = `${category}-${index}`;
        card.dataset.productName = name;
        card.dataset.selectable = canSelect ? 'true' : 'false';

        if (!canSelect) {
            if (!isCatalogTrigger) card.removeAttribute('onclick');
            card.classList.add('display-only');
            card.style.cursor = isCatalogTrigger ? 'pointer' : 'default';
            return;
        }

        card.classList.add('swipe-ready');
        const extra = additionalSizeOptions[`${category}|${name}`] || [];
        const options = [dimension, ...extra].filter(Boolean);
        card.dataset.sizeOptions = JSON.stringify(options);
        card.dataset.sizeIndex = '0';
        if (options.length > 1) {
            const nav = document.createElement('div');
            nav.className = 'card-size-nav';
            nav.innerHTML = `<button type="button" aria-label="Previous size" onclick="changeCardSize(event, this, -1)">‹</button><span class="card-size-position">1/${options.length}</span><button type="button" aria-label="Next size" onclick="changeCardSize(event, this, 1)">›</button>`;
            card.querySelector('.info')?.appendChild(nav);
        }
        attachSwipe(card);
    });
}

function attachSwipe(card) {
    let startX = 0, startY = 0;
    card.addEventListener('touchstart', e => {
        if (!e.touches || !e.touches[0]) return;
        startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    }, {passive:true});
    card.addEventListener('touchend', e => {
        if (!e.changedTouches || !e.changedTouches[0]) return;
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
            card.dataset.swipeClick = '1';
            changeSize(card, dx < 0 ? 1 : -1);
            setTimeout(() => card.dataset.swipeClick = '0', 350);
        }
    }, {passive:true});
    card.addEventListener('click', e => {
        if (card.dataset.swipeClick === '1') { e.preventDefault(); e.stopImmediatePropagation(); }
    }, true);
}

function changeCardSize(event, button, direction) {
    event.stopPropagation();
    const card = button.closest('.card');
    changeSize(card, direction);
}

function changeSize(card, direction) {
    const options = JSON.parse(card.dataset.sizeOptions || '[]');
    if (options.length < 2) return;
    let index = Number(card.dataset.sizeIndex || 0);
    index = (index + direction + options.length) % options.length;
    card.dataset.sizeIndex = String(index);
    const dimension = card.querySelector('.dimension');
    if (dimension) dimension.innerText = options[index];
    const position = card.querySelector('.card-size-position');
    if (position) position.innerText = `${index + 1}/${options.length}`;
    const selected = cart.find(item => item.id === card.dataset.productId);
    if (selected) selected.dimension = options[index];
    renderCartCount();
}

function toggleCart(card) {
    if (card.dataset.selectable !== 'true') return;
    const id = card.dataset.productId;
    const index = cart.findIndex(item => item.id === id);
    if (index > -1) {
        cart.splice(index, 1);
        card.classList.remove('selected');
    } else {
        const options = JSON.parse(card.dataset.sizeOptions || '[]');
        const sizeIndex = Number(card.dataset.sizeIndex || 0);
        cart.push({ id, name: card.dataset.productName, dimension: options[sizeIndex] || '', options, quantity: 1 });
        card.classList.add('selected');
    }
    renderCartCount();
}

function restoreSelections() {
    document.querySelectorAll('#gallery .card[data-selectable="true"]').forEach(card => {
        const item = cart.find(entry => entry.id === card.dataset.productId);
        if (item) {
            card.classList.add('selected');
            const options = JSON.parse(card.dataset.sizeOptions || '[]');
            const index = Math.max(0, options.indexOf(item.dimension));
            card.dataset.sizeIndex = String(index);
            const dimension = card.querySelector('.dimension');
            if (dimension && options[index]) dimension.innerText = options[index];
            const position = card.querySelector('.card-size-position');
            if (position) position.innerText = `${index + 1}/${options.length}`;
        }
    });
}

function renderCartCount() {
    const total = cart.reduce((sum, item) => sum + item.quantity, 0);
    document.getElementById('cartCount').innerText = total;
    const catalogCount = document.getElementById('catalogCartCount');
    if (catalogCount) catalogCount.innerText = total;
}

function openCartModal(fromCatalog = false) {
    returnToCatalogAfterCart = fromCatalog;
    renderCartModal();
    const modal = document.getElementById('cartModal');
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
}

function closeCartModal() {
    const modal = document.getElementById('cartModal');
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    const catalogStillOpen = document.getElementById('nestVineCatalogModal').classList.contains('open');
    document.body.style.overflow = catalogStillOpen ? 'hidden' : '';
}

function continueBrowsing() {
    const reopenCatalog = returnToCatalogAfterCart;
    returnToCatalogAfterCart = false;
    closeCartModal();
    if (reopenCatalog) openNestVineCatalog();
}

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

function renderCartModal() {
    const container = document.getElementById('cartItems');
    if (!cart.length) {
        container.innerHTML = '<div class="cart-empty">Your cart is empty.</div>';
        return;
    }
    container.innerHTML = cart.map(item => {
        const options = item.options || [item.dimension];
        const sizeControl = options.length > 1
            ? `<select class="cart-size-select" aria-label="Choose size for ${escapeHtml(item.name)}" onchange="updateCartSize('${item.id}', this.value)">${options.map(option => `<option value="${escapeHtml(option)}" ${option === item.dimension ? 'selected' : ''}>${escapeHtml(option)}</option>`).join('')}</select>`
            : `<div class="cart-item-size">${escapeHtml(item.dimension)}</div>`;
        return `<div class="cart-item"><div><div class="cart-item-name">${escapeHtml(item.name)}</div>${sizeControl}</div><div class="cart-item-controls">
    <input
        type="number"
        class="cart-qty-input"
        min="1"
        step="1"
        value="${item.quantity}"
        aria-label="Quantity for ${escapeHtml(item.name)}"
        onchange="setQuantity('${item.id}', this.value)"
    >
</div><button class="cart-remove" type="button" onclick="removeCartItem('${item.id}')">Remove item</button></div>`;
    }).join('');
}

function changeQuantity(id, change) {
    const item = cart.find(entry => entry.id === id);
    if (!item) return;
    item.quantity = Math.max(1, item.quantity + change);
    renderCartModal(); renderCartCount();
}

    function setQuantity(id, value) {
    const item = cart.find(entry => entry.id === id);
    if (!item) return;

    const quantity = parseInt(value, 10);

    item.quantity = Number.isFinite(quantity) && quantity >= 1
        ? quantity
        : 1;

    renderCartModal();
    renderCartCount();
}

function removeCartItem(id) {
    cart = cart.filter(item => item.id !== id);
    document.querySelectorAll('#gallery .card').forEach(card => { if (card.dataset.productId === id) card.classList.remove('selected'); });
    renderCartModal(); renderCartCount();
}

function updateCartSize(id, dimension) {
    const item = cart.find(entry => entry.id === id);
    if (item) item.dimension = dimension;
    const card = document.querySelector(`#gallery .card[data-product-id="${CSS.escape(id)}"]`);
    if (card) {
        const options = JSON.parse(card.dataset.sizeOptions || '[]');
        const index = options.indexOf(dimension);
        if (index >= 0) { card.dataset.sizeIndex = String(index); const label = card.querySelector('.dimension'); if (label) label.innerText = dimension; const position = card.querySelector('.card-size-position'); if (position) position.innerText = `${index + 1}/${options.length}`; }
    }
}

function sendCartToWhatsApp() {
    if (!cart.length) { alert('Please select at least one planter.'); return; }
    const phoneNumber = '919904077701';
    let message = 'Hello, I am interested in the following planters:\n\n';
    cart.forEach((item, index) => {
        message += `${item.name}${item.dimension ? `\nDimensions: ${item.dimension}` : ''}\nQuantity: ${item.quantity}\n\n`;
    });
    message += '\nPlease share more details.';
    window.open(`https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`, '_blank', 'noopener,noreferrer');
}

/* Scroll To Top */

window.onscroll = function () {

    const topBtn = document.getElementById("topBtn");

    if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
        topBtn.style.display = "block";
    } else {
        topBtn.style.display = "none";
    }
};

function scrollToTop() {

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}

document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
        closeNestVineCatalog();
        closeCartModal();
    }
});

/* Default Load */

loadCategory('intro', document.querySelector('.filter-btn'));

</script>
