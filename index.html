<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shrinath Planter Studio</title>

<style>

/* Smooth fade animation for category change */
.fade-in {
    animation: fadeIn 0.35s ease-in-out;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
    color: #2e2e2e;
}

h1 {
    text-align: center;
    padding: 20px 10px 8px;
    font-size: 34px;
    color: #1b5e20;
}

/* Cart Button */

.cart-btn {
    position: fixed;
    top: 10px;
    right: 10px;
    background: none;
    color: white;
    border: #1b5e20;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    font-size: 24px;
    cursor: pointer;
    z-index: 999;
    box-shadow: 0 8px 18px rgba(0,0,0,0.25);
}

.cart-count {
    position: absolute;
    top: -5px;
    right: -5px;
    background: red;
    color: white;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Move To Top Button */

.top-btn {
    position: fixed;
    bottom: 25px;
    right: 22px;
    background: #1b5e20;
    color: white;
    border: none;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    font-size: 26px;
    cursor: pointer;
    display: none;
    z-index: 999;
    box-shadow: 0 8px 18px rgba(0,0,0,0.25);
}

.filter-bar {
    text-align: center;
    margin-bottom: 20px;
}

.filter-btn {
    padding: 10px 18px;
    margin: 5px;
    border: none;
    border-radius: 25px;
    font-size: 15px;
    cursor: pointer;
    background: #e0e0e0;
    transition: 0.3s;
}

.filter-btn.active,
.filter-btn:hover {
    background: #1b5e20;
    color: white;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
    padding: 30px;
    max-width: 1400px;
    margin: auto;
}

.card {
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    overflow: hidden;
    transition: transform 0.3s ease;
    cursor: pointer;
    position: relative;
}

.card:hover {
    transform: translateY(-6px);
}

.card.selected {
    border: 4px solid #1b5e20;
}

.card img {
    width: 100%;
    height: 480px;
    object-fit: contain;
    object-position: center;
    background: white;
    display: block;
    padding: 4px;
    box-sizing: border-box;
}

.info {
    padding: 15px;
    text-align: center;
}

.name {
    font-size: 20px;
    font-weight: 600;
    color: #1b5e20;
}

.dimension {
    font-size: 15px;
    color: #555;
    margin-top: 4px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #666;
    font-size: 14px;
}

</style>
</head>

<body>

<!-- Cart Button -->
<button class="cart-btn" onclick="sendCartToWhatsApp()">
    🛒
    <span class="cart-count" id="cartCount">0</span>
</button>

<!-- Move To Top Button -->
<button class="top-btn" id="topBtn" onclick="scrollToTop()">
    ↑
</button>

<h1>🌿 Shrinath Planter Studio 🌿</h1>

<div class="filter-bar">
    <button class="filter-btn active" onclick="loadCategory('snake', this)">Snake Plant</button>
    <button class="filter-btn" onclick="loadCategory('areca', this)">Areca Palm</button>
    <button class="filter-btn" onclick="loadCategory('ficus', this)">Ficus Lyrata</button>
    <button class="filter-btn" onclick="loadCategory('bird', this)">Bird of Paradise</button>
    <button class="filter-btn" onclick="loadCategory('champayne', this)">Champayne Palm</button>
</div>

<div id="gallery" class="gallery"></div>

<footer>
    Adas, Vasad, Anand, Gujarat
</footer>

<script>

const cart = [];

const data = {

    snake: `

        <div class="card" onclick="toggleCart(this, 'Planter1')">
            <img src="https://raw.githubusercontent.com/vatxal/Shrinathplanterstudio/f5b8722e774ba2dc3d6f5cb448412f33f51748f8/arecanew.png">
            <div class="info">
                <div class="name">Tall square planter</div>
                <div class="dimension">Dimension: 12x12</div>
            </div>
        </div>

      <div class="card" onclick="toggleCart(this, 'Planter2')">
            <img src="https://raw.githubusercontent.com/vatxal/images/1195b6a96c92e73b00962e86595dba97da3dfd19/IMG1.JPG">
            <div class="info">
                <div class="name">Planter2</div>
                <div class="dimension">Dimension: 12x12</div>
            </div>
        </div>
    `,

    areca: `

        <div class="card" onclick="toggleCart(this, 'Planter1')">
            <img src="https://raw.githubusercontent.com/vatxal/Shrinathplanterstudio/f5b8722e774ba2dc3d6f5cb448412f33f51748f8/arecanew.png">
            <div class="info">
                <div class="name">Planter1</div>
                <div class="dimension">Dimension: 12x12</div>
            </div>
        </div>

      <div class="card" onclick="toggleCart(this, 'Planter2')">
            <img src="https://raw.githubusercontent.com/vatxal/images/1195b6a96c92e73b00962e86595dba97da3dfd19/IMG1.JPG">
            <div class="info">
                <div class="name">Planter2</div>
                <div class="dimension">Dimension: 12x12</div>
            </div>
        </div>
    `,

   ficus: `

        <div class="card" onclick="toggleCart(this, 'Planter1')">
            <img src="https://raw.githubusercontent.com/vatxal/Shrinathplanterstudio/f5b8722e774ba2dc3d6f5cb448412f33f51748f8/arecanew.png">
            <div class="info">
                <div class="name">Planter1</div>
                <div class="dimension">Dimension: 12x12</div>
            </div>
        </div>

      <div class="card" onclick="toggleCart(this, 'Planter2')">
            <img src="https://raw.githubusercontent.com/vatxal/images/1195b6a96c92e73b00962e86595dba97da3dfd19/IMG1.JPG">
            <div class="info">
                <div class="name">Planter2</div>
                <div class="dimension">Dimension: 12x12</div>
            </div>
        </div>
    `,

   bird: `

        <div class="card" onclick="toggleCart(this, 'Planter1')">
            <img src="https://raw.githubusercontent.com/vatxal/images/1195b6a96c92e73b00962e86595dba97da3dfd19/IMG1.JPG">
            <div class="info">
                <div class="name">Planter1</div>
                <div class="dimension">Dimension: 12x12</div>
            </div>
        </div>

      <div class="card" onclick="toggleCart(this, 'Planter2')">
            <img src="https://raw.githubusercontent.com/vatxal/images/1195b6a96c92e73b00962e86595dba97da3dfd19/IMG1.JPG">
            <div class="info">
                <div class="name">Planter2</div>
                <div class="dimension">Dimension: 12x12</div>
            </div>
        </div>
    `,

   champayne: `

        <div class="card" onclick="toggleCart(this, 'Planter1')">
            <img src="https://raw.githubusercontent.com/vatxal/images/1195b6a96c92e73b00962e86595dba97da3dfd19/IMG1.JPG">
            <div class="info">
                <div class="name">Planter1</div>
                <div class="dimension">Dimension: 12x12</div>
            </div>
        </div>

      <div class="card" onclick="toggleCart(this, 'Planter2')">
            <img src="https://raw.githubusercontent.com/vatxal/images/1195b6a96c92e73b00962e86595dba97da3dfd19/IMG1.JPG">
            <div class="info">
                <div class="name">Planter2</div>
                <div class="dimension">Dimension: 12x12</div>
            </div>
        </div>
    `
};

function loadCategory(category, btn) {

    const gallery = document.getElementById("gallery");

    gallery.innerHTML = "";

    gallery.classList.remove("fade-in");
    void gallery.offsetWidth;
    gallery.classList.add("fade-in");

    gallery.innerHTML = data[category];

    document.querySelectorAll('.filter-btn')
        .forEach(b => b.classList.remove('active'));

    btn.classList.add('active');

    restoreSelections();
}

function toggleCart(card, plantName) {

    const index = cart.indexOf(plantName);

    if (index > -1) {
        cart.splice(index, 1);
        card.classList.remove("selected");
    } else {
        cart.push(plantName);
        card.classList.add("selected");
    }

    updateCartCount();
}

function updateCartCount() {
    document.getElementById("cartCount").innerText = cart.length;
}

function restoreSelections() {

    document.querySelectorAll('.card').forEach(card => {

        const plantName = card.querySelector('.name').innerText;

        if (cart.includes(plantName)) {
            card.classList.add("selected");
        }
    });
}

function sendCartToWhatsApp() {

    if (cart.length === 0) {
        alert("Please select at least one plant.");
        return;
    }

    const phoneNumber = "919904077701";

    let message = "Hello, I am interested in the following planters:%0A%0A";

    cart.forEach((item, index) => {
        message += `${index + 1}. ${item}%0A`;
    });

    message += "%0APlease share more details.";

    window.open(`https://wa.me/${phoneNumber}?text=${message}`, "_blank");
}

/* Scroll To Top */

window.onscroll = function () {

    const topBtn = document.getElementById("topBtn");

    if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
        topBtn.style.display = "block";
    } else {
        topBtn.style.display = "none";
    }
};

function scrollToTop() {

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}

/* Default Load */

loadCategory('exotic', document.querySelector('.filter-btn'));

</script>

</body>
</html>
